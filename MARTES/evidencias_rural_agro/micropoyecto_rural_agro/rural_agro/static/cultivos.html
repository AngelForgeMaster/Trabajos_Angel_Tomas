<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rural Agro - Cultivos</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="dashboard-body">

    <header class="topbar">
        <h1>🌱 Rural Agro</h1>
        <button onclick="cerrarSesion()" class="btn-logout">Cerrar sesión</button>
    </header>

    <main class="contenido">
        <a href="javascript:history.back()" class="link-volver">← Volver a parcelas</a>

        <div class="encabezado-seccion">
            <h2 id="tituloParcela">🌽 Cultivos</h2>
            <button id="btnMostrarForm" class="btn-primary btn-pequeno">+ Nuevo cultivo</button>
        </div>

        <form id="formCultivo" class="form-tarjeta oculto">
            <div class="campo">
                <label for="tipoCultivo">Tipo de cultivo</label>
                <input type="text" id="tipoCultivo" placeholder="Ej: Maíz" required>
            </div>
            <div class="campo">
                <label for="variedadCultivo">Variedad</label>
                <input type="text" id="variedadCultivo" placeholder="Ej: Amarillo duro" required>
            </div>
            <div class="campo">
                <label for="tipoSemilla">Tipo de semilla</label>
                <input type="text" id="tipoSemilla" placeholder="Ej: Híbrida" required>
            </div>
            <div class="campo">
                <label for="cantidadSemilla">Cantidad de semilla (kg)</label>
                <input type="number" id="cantidadSemilla" step="0.01" min="0" required>
            </div>
            <div class="campo">
                <label for="precioSemilla">Precio de la semilla</label>
                <input type="number" id="precioSemilla" step="0.01" min="0" required>
            </div>
            <div class="campo">
                <label for="fechaSiembra">Fecha de siembra</label>
                <input type="date" id="fechaSiembra" required>
            </div>
            <div class="campo">
                <label for="fechaCosecha">Fecha estimada de cosecha (opcional)</label>
                <input type="date" id="fechaCosecha">
            </div>
            <p id="mensajeErrorCultivo" class="mensaje-error"></p>
            <button type="submit" class="btn-primary">Guardar cultivo</button>
        </form>

        <p id="mensajeCarga">Cargando cultivos...</p>
        <div id="listaCultivos" class="tarjetas"></div>
    </main>

    <script src="/static/js/config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/cultivos.js"></script>
</body>
</html>
